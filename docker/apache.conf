<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Render terminates HTTPS before forwarding requests to Apache.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Protect all CRUD pages and mutation endpoints in the deployed app.
    <LocationMatch "^/crud(projects|tools)(/|$)">
        AuthType Basic
        AuthName "Portfolio management"
        AuthUserFile /etc/apache2/portfolio.htpasswd
        Require valid-user
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
