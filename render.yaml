services:
  - type: web
    name: jinn-portfolio
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_KEY
        sync: false
      - key: CRUD_USERNAME
        sync: false
      - key: CRUD_PASSWORD
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: jinn-portfolio-db
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: SEED_DATABASE
        value: "true"

databases:
  - name: jinn-portfolio-db
    plan: free
    region: singapore
    databaseName: portfolio
    user: portfolio
